name: 审核模型线索
on:
  workflow_dispatch:
    inputs:
      decision:
        description: '由本地审核页提交的完整审核记录'
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: atlas-data-write
  queue: max
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - id: review
        name: 核对原文并应用人工审核
        env:
          REVIEW_DECISION: ${{ inputs.decision }}
        run: npm run review:apply
      - name: 提交已审核数据
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review/queue.json public/data/atlas.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: apply maintainer review'
            git push origin HEAD:main
          fi
      - name: 启动部署校验
        if: steps.review.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
