name: 每周检查来源链接

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node scripts/check-links.mjs > report.txt 2>&1
        continue-on-error: true
      - if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '以下来源链接疑似失效，需要人工复核后更新记录状态或换成存档链接。'
            echo
            echo '```'
            tail -n 40 report.txt
            echo '```'
          } > body.md
          gh issue create --title "来源链接疑似失效 $(date -u +%F)" --body-file body.md
