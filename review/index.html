<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型纪元 · 审核</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--panel:#fff;--ink:#21344d;--muted:#67778b;--line:#dce2e9;--accent:#3e608b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:24px 32px;border-bottom:1px solid var(--line);gap:16px}h1{font:600 28px Georgia,serif;margin:0}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:7px;padding:8px 14px;background:var(--panel);cursor:pointer}button:disabled{opacity:.5;cursor:wait}main{display:grid;grid-template-columns:330px 1fr;max-width:1400px;margin:auto;padding:24px;gap:24px}aside,section{min-width:0}aside{position:sticky;top:16px;align-self:start}#list{display:grid;gap:8px;margin-top:12px;max-height:calc(100vh - 260px);overflow:auto}.item{text-align:left;display:block;width:100%;padding:14px}.item[aria-current=true]{outline:2px solid var(--accent)}small,.muted{color:var(--muted)}small{display:block}#count{margin-left:10px}h2{font-size:21px;margin:0 0 12px}label{display:grid;gap:4px;margin:12px 0}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:9px}textarea{min-height:75px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:18px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.primary{background:var(--accent);color:#fff}a{color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;font:14px/1.8 system-ui;background:var(--bg);padding:16px}#notice{padding:12px 32px;margin:0;overflow-wrap:anywhere}#notice:empty{display:none}.check{display:flex;align-items:center;gap:10px}.check input{width:auto}.hidden{display:none!important}#search{margin-top:12px}@media(max-width:850px){aside{position:static}main{grid-template-columns:1fr}.row{grid-template-columns:1fr}header{padding:16px}main{padding:16px}#list{max-height:300px;overflow:auto}}@media(prefers-color-scheme:dark){:root{--bg:#151c27;--panel:#1b2635;--ink:#e1e7ef;--muted:#a2b2c7;--line:#34445a;--accent:#7298c5}}
</style></head><body><header><h1>模型纪元 · 审核</h1><div class="actions"><span id="actor"></span><button id="sync">同步待审核</button></div></header><p id="notice" role="status"></p><main><aside><select id="status"><option value="pending">待审核</option><option value="deferred">暂缓</option><option value="published">已发布</option><option value="rejected">已忽略</option></select><input id="search" placeholder="搜索标题或来源"><p id="count"></p><div id="list"></div></aside><section><div id="empty" class="panel">从左侧选择一条线索。采集结果不会直接出现在网站上。</div><div id="detail" class="hidden">
<div class="panel"><h2 id="title"></h2><p id="discovery" class="muted"></p><a id="original" target="_blank" rel="noopener noreferrer">打开线索原文 ↗</a><p id="processed" class="muted"></p></div>
<form id="form"><div class="panel"><div class="row"><label>核验来源<select id="source" required></select></label><label>原文链接<input id="url" type="url" required></label></div><button id="read" type="button">读取原文</button><pre id="body">请选择对应发布方，再读取可公开访问的原文。</pre>
<div class="row"><label>模型名称<input id="name" required></label><label>厂商<select id="vendor" required></select></label></div><div class="row"><label>记录类型<select id="type"><option value="event">历史事件</option><option value="forecast">未来线索</option></select></label><label>事件<select id="kind"></select></label></div>
<div class="row"><label>记录 ID<input id="id" required pattern="[a-z0-9][a-z0-9-]{1,79}" placeholder="例如 claude-sonnet-4-6-api"></label><label>操作<select id="operation"><option value="create">新增</option><option value="update">更新已有记录</option></select></label></div><label id="target-label" class="hidden">要更新的记录<select id="target"></select></label>
<label id="date-label">事件日期<input id="date" type="date"></label><div id="window" class="row hidden"><label>时间窗口起点<input id="start" type="date"></label><label>时间窗口终点<input id="end" type="date"></label></div><label>展示摘要<textarea id="summary" required></textarea></label>
<label>支持名称的原文摘录<textarea id="quote-name" required></textarea></label><label>支持事件类型的原文摘录<textarea id="quote-type" required></textarea></label><label>支持日期的原文摘录<textarea id="quote-date" placeholder="未来计划未公布日期时留空；文章发表时间不等于模型发布时间。"></textarea></label><label>证据说明<textarea id="note" required></textarea></label><label>处理或修订原因<input id="reason"></label>
<label class="check"><input id="checked" type="checkbox" required>我已阅读原文，核对模型名称、事件类型及日期；所填内容有原文支持。</label><div class="actions"><button id="publish" class="primary">审核通过并发布</button><button id="defer" type="button">暂缓</button><button id="reject" type="button">忽略</button></div><p class="muted">发布前会再次核对原文。媒体线索按媒体报道展示；没有日期就保留待定。</p></div></form></div></section></main><script type="module" src="/app.js"></script></body></html>
